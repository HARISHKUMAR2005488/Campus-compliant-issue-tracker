server {
    listen 80;
    # Replace with your EC2 public IP or domain name
    server_name _;

    # Allow large image uploads (up to 10 MB)
    client_max_body_size 10M;

    # Proxy all requests to Gunicorn
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Headers for Flask to know the real client IP
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (generous for S3 image uploads)
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # Serve static files directly (optional performance boost)
    location ~* \.(ico|css|js|png|jpg|jpeg|gif|svg|woff|woff2|ttf)$ {
        proxy_pass http://127.0.0.1:5000;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Health check endpoint (no logging spam)
    location /api/health {
        proxy_pass http://127.0.0.1:5000;
        access_log off;
    }
}
